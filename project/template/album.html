<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stamp Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        main {
            padding: 2rem;
        }

        .stamp-list {
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stamp-item {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 1rem;
            padding: 1rem;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stamp-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .stamp-image {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 1rem;
        }

        .button-container {
            text-align: center;
            margin-top: 2rem;
        }

        .add-stamp-button, .edit-stamp-button, .delete-stamp-button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .edit-stamp-button {
            background-color: #ffc107;
        }

        .delete-stamp-button {
            background-color: #dc3545;
        }

        .add-stamp-button:hover {
            background-color: #0056b3;
        }

        .edit-stamp-button:hover {
            background-color: #e0a800;
        }

        .delete-stamp-button:hover {
            background-color: #c82333;
        }
    </style>
    <script>
        function confirmDelete() {
            return confirm('Are you sure you want to delete this stamp?');
        }

        function confirmEdit() {
            return confirm('Are you sure you want to edit this stamp?');
        }
    </script>
</head>
<body>
    <header>
        <h1>{{ user.username }}'s Stamp Album</h1>
    </header>
    <main>
        <ul class="stamp-list">
            {% for stamp in album.stamps.all %}
                <li class="stamp-item">
                    <h2>{{ stamp.name }}</h2>
                    <img src="{{ stamp.image.url }}" alt="{{ stamp.name }}" class="stamp-image">
                    <p>{{ stamp.description }}</p>
                    <p>Year: {{ stamp.year }}</p>
                    <form method="post" action="{% url 'delete_stamp' stamp.id %}" onsubmit="return confirmDelete();">
                        {% csrf_token %}
                        <button type="submit" class="delete-stamp-button">Delete</button>
                    </form>
                    <a href="{% url 'edit_stamp' stamp.id %}" class="edit-stamp-button" onclick="return confirmEdit();">Edit</a>
                </li>
            {% endfor %}
        </ul>
        <div class="button-container">
            <a href="{% url 'add_stamp' %}" class="add-stamp-button">Add New Stamp</a>
        </div>
    </main>
</body>
</html>
